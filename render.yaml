services:
  - type: web
    name: rapid-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rapid-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://finalyr-project-ten.vercel.app,http://localhost:5173"

databases:
  - name: rapid-db
    databaseName: rapidodb
    user: rapidouser
    plan: free
